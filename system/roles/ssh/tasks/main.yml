---
- name: Install ssh packages
  ansible.builtin.package:
    name: "{{ ssh_packages }}"
    state: present
  become: true

- name: Ensure .ssh directory
  ansible.builtin.file:
    path: "{{ ssh_directory }}"
    state: directory
    mode: "0700"
  become: false

- name: Ensure known_hosts file
  ansible.builtin.copy:
    content: ""
    dest: "{{ ssh_known_hosts_path }}"
    mode: "0600"
    force: false
  become: false
