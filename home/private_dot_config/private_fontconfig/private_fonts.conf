<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Source Serif 4</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>
  <alias>
    <family>fantasy</family>
    <prefer>
      <family>Space Grotesk</family>
    </prefer>
  </alias>
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>
  <alias>
    <family>ui-sans-serif</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>
  <alias>
    <family>ui-serif</family>
    <prefer>
      <family>Source Serif 4</family>
    </prefer>
  </alias>
  <alias>
    <family>ui-monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append">
      <string>JetBrainsMono Nerd Font Propo</string>
    </edit>
    <edit name="family" mode="append">
      <string>Noto Color Emoji</string>
    </edit>
    <edit name="family" mode="append">
      <string>Font Awesome 7 Free</string>
    </edit>
    <edit name="family" mode="append">
      <string>Font Awesome 7 Brands</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="append">
      <string>JetBrainsMono Nerd Font Propo</string>
    </edit>
    <edit name="family" mode="append">
      <string>Noto Color Emoji</string>
    </edit>
    <edit name="family" mode="append">
      <string>Font Awesome 7 Free</string>
    </edit>
    <edit name="family" mode="append">
      <string>Font Awesome 7 Brands</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="append">
      <string>Noto Color Emoji</string>
    </edit>
    <edit name="family" mode="append">
      <string>Font Awesome 7 Free</string>
    </edit>
    <edit name="family" mode="append">
      <string>Font Awesome 7 Brands</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>fantasy</string></test>
    <edit name="family" mode="append">
      <string>JetBrainsMono Nerd Font Propo</string>
    </edit>
    <edit name="family" mode="append">
      <string>Noto Color Emoji</string>
    </edit>
    <edit name="family" mode="append">
      <string>Font Awesome 7 Free</string>
    </edit>
    <edit name="family" mode="append">
      <string>Font Awesome 7 Brands</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="append">
      <string>JetBrainsMono Nerd Font Propo</string>
    </edit>
    <edit name="family" mode="append">
      <string>Noto Color Emoji</string>
    </edit>
    <edit name="family" mode="append">
      <string>Font Awesome 7 Free</string>
    </edit>
    <edit name="family" mode="append">
      <string>Font Awesome 7 Brands</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>ui-sans-serif</string></test>
    <edit name="family" mode="append">
      <string>JetBrainsMono Nerd Font Propo</string>
    </edit>
    <edit name="family" mode="append">
      <string>Noto Color Emoji</string>
    </edit>
    <edit name="family" mode="append">
      <string>Font Awesome 7 Free</string>
    </edit>
    <edit name="family" mode="append">
      <string>Font Awesome 7 Brands</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>ui-serif</string></test>
    <edit name="family" mode="append">
      <string>JetBrainsMono Nerd Font Propo</string>
    </edit>
    <edit name="family" mode="append">
      <string>Noto Color Emoji</string>
    </edit>
    <edit name="family" mode="append">
      <string>Font Awesome 7 Free</string>
    </edit>
    <edit name="family" mode="append">
      <string>Font Awesome 7 Brands</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>ui-monospace</string></test>
    <edit name="family" mode="append">
      <string>Noto Color Emoji</string>
    </edit>
    <edit name="family" mode="append">
      <string>Font Awesome 7 Free</string>
    </edit>
    <edit name="family" mode="append">
      <string>Font Awesome 7 Brands</string>
    </edit>
  </match>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
